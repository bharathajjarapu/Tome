services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pka
      POSTGRES_PASSWORD: pka
      POSTGRES_DB: pka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pka"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
