[project]
name = "pka-backend"
version = "0.1.0"
description = "Team Project Knowledge Base Assistant — backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt>=5.0.0",
    "fastapi>=0.115",
    "fastembed>=0.8.0",
    "firecrawl-anydoc>=0.2.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["alembic/versions"]  # generated code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["pka"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = "alembic/versions"
