# Brute force on login and register gets ten tries a minute per address.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    # Rejected here, before the API spools it. Matches MAX_UPLOAD_BYTES plus multipart overhead.
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.html;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        # Answers stream token by token; buffering would hold them until the end.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
